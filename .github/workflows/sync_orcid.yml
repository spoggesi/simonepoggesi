name: Sync ORCID Publications

on:
  schedule:
    # Run monthly on the 1st at 00:00 UTC
    - cron: '0 0 1 * *'
  workflow_dispatch: # Allows manual triggering from the GitHub UI

# Permessi di scrittura per consentire a GitHub Actions di fare il push delle modifiche
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run ORCID Sync Script
      env:
        ORCID_ID: ${{ secrets.ORCID_ID }} # Inserito ORCID_ID senza trattini/underscores extra
      run: python sync_orcid.py

    - name: Commit and Push Changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add PUBLICATIONS.md
        if [[ -n $(git status --porcelain) ]]; then
          git commit -m "Update publications from ORCID [skip ci]"
          git push
        else
          echo "No changes to commit."
        fi